name: CI/CD

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks + tests
        env:
          DJANGO_SETTINGS_MODULE: chickentender.settings_dev
        run: |
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        run: |
          ssh-keyscan -H "${{ secrets.PA_HOST || 'ssh.pythonanywhere.com' }}" >> ~/.ssh/known_hosts

      - name: Deploy on PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_HOST: ${{ secrets.PA_HOST || 'ssh.pythonanywhere.com' }}
        run: |
          ssh "${PA_USERNAME}@${PA_HOST}" "cd ~/ChickenTender && ./deploy.sh"
