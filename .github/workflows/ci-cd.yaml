name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: deploy-pythonanywhere
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks + tests
        env:
          DJANGO_SETTINGS_MODULE: chickentender.settings
        run: |
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PA_HOST }}          # e.g. ssh.pythonanywhere.com
          username: ${{ secrets.PA_USERNAME }}  # your PA username
          key: ${{ secrets.PA_SSH_PRIVATE_KEY }}# private key for PA SSH
          script: |
            set -euo pipefail
            set -x

            # IMPORTANT: change this to the folder where the repo is cloned on PythonAnywhere
            cd /home/${{ secrets.PA_USERNAME }}/ChickenTender

            # Make sure we can see the commit, then deploy exactly what GitHub built
            git fetch origin
            git checkout main
            git reset --hard ${{ github.sha }}

            echo "Deployed commit:"
            git rev-parse HEAD
            git log -1 --oneline

            # Optional (uncomment if you want to install/update deps on deploy)
            # workon YOUR_VENV_NAME
            # pip install -r requirements.txt

      - name: Reload PythonAnywhere webapp
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_KEY }}       # PythonAnywhere API token
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_DOMAIN_NAME: ${{ secrets.PA_DOMAIN_NAME }} # e.g. yourusername.pythonanywhere.com
        run: |
          if [ -z "${PA_API_TOKEN}" ]; then
            echo "PA_API_TOKEN is empty (GitHub secret missing or not exposed)"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN_NAME}/reload/"
