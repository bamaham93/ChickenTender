name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: deploy-pythonanywhere
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks + tests
        env:
          DJANGO_SETTINGS_MODULE: chickentender.settings
        run: |
          python manage.py check
          python manage.py test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.PA_HOST_SSH }}
          username: ${{ secrets.PA_USERNAME }}
          key: ${{ secrets.PA_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            set -x

            PROJECT_DIR="/home/${{ secrets.PA_USERNAME }}/ChickenTender"
            VENV_PATH="/home/${{ secrets.PA_USERNAME }}/.virtualenvs/hbc-env"

            cd "$PROJECT_DIR"

            echo "Before update:"
            git rev-parse HEAD || true

            git fetch origin
            git checkout main
            git reset --hard ${{ github.sha }}

            echo "After update:"
            git rev-parse HEAD
            git log -1 --oneline

            echo "Activating PythonAnywhere virtualenv"
            source "$VENV_PATH/bin/activate"

            echo "Installing dependencies"
            pip install --upgrade pip
            pip install -r requirements.txt

      - name: Reload PythonAnywhere webapp
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_KEY }}
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_DOMAIN_NAME: ${{ secrets.PA_DOMAIN_NAME }}
        run: |
          if [ -z "${PA_API_TOKEN}" ]; then
            echo "PA_API_TOKEN is empty"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN_NAME}/reload/"
