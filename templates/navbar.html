<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'restaurants:index' %}">ChickenTender</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#main-nav"
      aria-controls="main-nav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'restaurants:index' %}">Dashboard</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-muted small">Signed in as <strong>{{ user.username }}</strong></span>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Sign out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Sign in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
